# =============================================================================
# Sub-For-Creator — monitoring stack (Prometheus + Grafana)
#
# Override file: merges with docker-compose.yml, does NOT modify it.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Services added:
#   prometheus  : scrapes http://api:8000/api/metrics every 15s  (port 9090)
#   grafana     : provisioned datasource + dashboard              (port 3000)
#
# Grafana login: admin / ${GRAFANA_ADMIN_PASSWORD:-admin} (change in .env).
# See docs/MONITORING.md for the full runbook.
# =============================================================================

services:
  # ---- Prometheus (metrics storage + alert evaluation) ----
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    depends_on:
      api:
        condition: service_healthy

  # ---- Grafana (dashboards; datasource + dashboard auto-provisioned) ----
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
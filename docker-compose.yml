# =============================================================================
# Sub-For-Creator 部署编排（docker compose，无需 version 字段）
#
# 服务：redis（消息队列） / api（FastAPI :8000） / worker（Celery）
#       / beat（Celery 定時清理排程） / web（nginx :8080） + 可选 postgres（默认注释，见下）
#
# 快速开始：
#   cp .env.example .env
#   docker compose up -d --build
#   前端：http://localhost:8080     API：http://localhost:8000/api
#
# ---------- PostgreSQL 说明（重要）----------
# 默认使用 SQLite（/data/app.db，持久化在 sfc-data 卷），单机部署零配置。
# 迁移到公共托管 / 多实例时启用 postgres，步骤：
#   1) 在 backend/requirements.txt 中追加一行：psycopg[binary]>=3.1
#      （SQLAlchemy 连接 postgres 需要该驱动；orchestrator 未在默认依赖中携带）
#   2) 取消下方 postgres 服务块注释；
#   3) 在 .env 中设置 SFC_DATABASE_URL 为：
#      postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
#   4) 给 api / worker 的 depends_on 追加 postgres（condition: service_healthy）
#   5) 重新构建：docker compose up -d --build
#
# ---------- GPU 加速（worker，可选）----------
# WhisperX + torch 需要 NVIDIA GPU。步骤：
#   1) 宿主机安装 NVIDIA Container Toolkit（nvidia-container-toolkit）
#   2) 用 GPU 参数重新构建共享镜像：
#      docker compose build --build-arg INSTALL_GPU=1 api
#      （api 与 worker 共用同一镜像；api 不受影响，仅镜像变大）
#   3) 取消下方 worker 的 deploy.resources 注释块
#
# ---------- 多 GPU 横向扩展（可选）----------
# 单机多 GPU / 多节点 worker 舰队：取消下方 worker-gpu / render-worker
# 服务块注释，按 docs/DEPLOY-MULTI-GPU.md 的 runbook 操作（SFC_GPU_INDEX
# 绑定 GPU、-Q 队列拆分、S3 共享存储等）。
# =============================================================================

# api / worker 共享的容器内环境（覆盖 .env 中的本地路径，指向容器内服务）
x-app-env: &app-env
  SFC_UPLOAD_DIR: /data/uploads
  SFC_DATABASE_URL: sqlite:////data/app.db
  SFC_CELERY_BROKER_URL: redis://redis:6379/0
  SFC_QUEUE_BACKEND: celery

services:
  # ---- 消息队列 / 结果缓存 ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- 后端 API（FastAPI :8000）----
  api:
    build: ./backend
    image: sfc-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *app-env
    volumes:
      - sfc-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Celery worker（与 api 共享同一镜像，仅命令不同）----
  worker:
    build: ./backend
    image: sfc-backend:latest
    restart: unless-stopped
    # 消费全部队列（transcribe=ASR / render=烧录 / celery=默认轻量任务），
    # 保持单 worker 部署行为不变；多 GPU 拆分时用 -Q 只消费部分队列
    # （见 docs/DEPLOY-MULTI-GPU.md）
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "transcribe,render,celery"]
    env_file:
      - .env
    environment:
      <<: *app-env
      SFC_ASR_BACKEND: faster-whisper
      SFC_WHISPER_MODEL: small
    volumes:
      - sfc-data:/data
    depends_on:
      redis:
        condition: service_healthy
    # ---- GPU 加速（可选；默认注释，保证无 GPU 也能一键启动）----
    # WhisperX 需要 GPU 才实用（large-v3 在 CPU 上极慢）。启用步骤：
    #   1) 宿主机安装 NVIDIA Container Toolkit
    #   2) docker compose build --build-arg INSTALL_GPU=1 api（重建共享镜像）
    #   3) 取消下面 deploy 块的注释：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ---- GPU worker（多 GPU 横向扩展；默认注释，见文件头部说明）----
  # 在 GPU 宿主机上启用：
  #   1) 宿主机安装 NVIDIA Container Toolkit
  #   2) docker compose build --build-arg INSTALL_GPU=1 api（重建共享镜像）
  #   3) 取消下方 worker-gpu 服务块注释
  #   4) 启动 N 个副本（每个副本通过 SFC_GPU_INDEX 绑定 GPU，0-based）：
  #        docker compose up -d --scale worker-gpu=2
  #     注意：--scale 的所有副本共享同一份 environment（SFC_GPU_INDEX=0），
  #     即 2 个 worker 共用 GPU 0（int8 large-v3 约 8GB，可共驻）；
  #     要分散到多张 GPU，请为每张 GPU 建一个 override 文件设置不同
  #     SFC_GPU_INDEX（示例见 docs/DEPLOY-MULTI-GPU.md）。
  # worker-gpu:
  #   image: sfc-backend:latest
  #   restart: unless-stopped
  #   command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "transcribe"]
  #   env_file:
  #     - .env
  #   environment:
  #     <<: *app-env
  #     SFC_ASR_BACKEND: whisperx
  #     SFC_WHISPERX_MODEL: large-v3
  #     SFC_GPU_INDEX: 0
  #   volumes:
  #     - sfc-data:/data
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

  # ---- Render worker（ffmpeg 烧录渲染；默认注释）----
  # 把 MP4/WebM 烧录渲染从 API 进程移到独立 worker（render 队列），
  # 需要先应用 api/export.py 的 wiring diff（见 docs/DEPLOY-MULTI-GPU.md）。
  # 渲染是 CPU 密集（libx264/libvpx），不需要 GPU，可与 transcribe worker
  # 分开扩缩容：
  #   docker compose up -d --scale render-worker=2
  # render-worker:
  #   image: sfc-backend:latest
  #   restart: unless-stopped
  #   command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "render"]
  #   env_file:
  #     - .env
  #   environment:
  #     <<: *app-env
  #   volumes:
  #     - sfc-data:/data
  #   depends_on:
  #     redis:
  #       condition: service_healthy

  # ---- Celery beat（TTL 清理排程；celery 队列模式下过期文件清理依赖本服务）----
  beat:
    image: sfc-backend:latest
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      <<: *app-env
    volumes:
      - sfc-data:/data
    depends_on:
      redis:
        condition: service_healthy

  # ---- 前端（nginx，SPA + /api 反代，:8080）----
  web:
    build: ./frontend
    image: sfc-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  # ---- PostgreSQL（公共部署时启用；默认注释，见文件头部说明）----
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB}
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sfc} -d ${POSTGRES_DB:-sfc}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #   # 启用后还需：
  #   #   - 给 api / worker 的 depends_on 追加本服务（condition: service_healthy）
  #   #   - 在 .env 中把 SFC_DATABASE_URL 改为 postgresql+psycopg://...（见头部说明）

volumes:
  # 应用数据卷（uploads + sqlite 数据库），worker 与 api 共享
  sfc-data:
  # postgres 数据卷（启用 postgres 服务时使用）
  pgdata:

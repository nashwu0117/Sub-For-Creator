# ============================================================
# Sub-For-Creator 前端站点配置（nginx）
#
# 关键点：
#   - /api/ 反向代理到后端服务 api:8000，保留 /api 前缀
#     （proxy_pass 不带尾斜杠/路径，nginx 会透传原始 URI：
#      /api/jobs → http://api:8000/api/jobs）
#   - client_max_body_size 2g 必须大于 SFC_MAX_UPLOAD_MB 默认值 1024
#   - SPA fallback：非静态文件路径回退到 index.html
#   - /assets/ 带 hash 文件名 → 缓存 1 年（immutable）
#   - index.html → no-cache（发布后立即拿到新版本）
# ============================================================
server {
    listen 80;
    server_name _;

    # 上传上限：2g > SFC_MAX_UPLOAD_MB 默认 1024MB（nginx 默认仅 1m，必须显式设置）
    client_max_body_size 2g;

    # 静态资源压缩
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # ---- API 反向代理（保留 /api 前缀，proxy_pass 不带尾斜杠）----
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传 + 长轮询任务需要较长的读写超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- 带内容 hash 的构建产物：长期缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- index.html：不缓存，确保发版后用户立即拿到新页面 ----
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # ---- SPA fallback：其余路径一律回退到 index.html ----
    location / {
        try_files $uri /index.html;
    }
}
